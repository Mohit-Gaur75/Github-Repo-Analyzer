name: 🐛 Bug Report
description: Report something that's broken
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug! Fill in the details below."

  - type: textarea
    id: description
    attributes:
      label: 🐛 What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Enter repo URL '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Error logs / Console output
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: 📍 Which area?
      options:
        - Frontend UI
        - Backend API
        - GitHub API / Token
        - AI Insights (Gemini)
        - Activity Feed (SSE)
        - Other
    validations:
      required: true
