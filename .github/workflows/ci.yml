name: 🔄 CI — Lint, Build & Security

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: 🛠 Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: ✅ Syntax check (all source files)
        run: |
          find src -name "*.js" | xargs -I{} node --check {}

      - name: 🔒 Audit dependencies (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true  # Warn but don't fail CI on audit issues

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build (production)
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5001/api  # Placeholder for build

      - name: 🔒 Audit dependencies (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─── Summary ──────────────────────────────────────────────────────────────
  ci-success:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed!"
